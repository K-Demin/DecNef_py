# Binary sign controller pilot. Paddle height is visual only and fixed across levels.
# Brain input uses the latest normalized TR, z > 0 => TOP; otherwise BOTTOM.
# Keyboard behavior uses a fixed 6 s delay; NF has no additional delay.
# Legacy paddle_lag/response settings are accepted but bypassed by binary control.
# Speeds and trial timing retain the existing values (speeds are per display frame).

# Window settings
win_size: [1200, 800]
fullscr: true

# Input configuration
keyboard_delay_sec: 6.0 # keyboard mode only: 1=TOP, 2=BOTTOM after 6 s
paddle_response_mode: hold # hrf or hold

# Difficulty and scoring
init_level: 0
init_points: 0
point_increment: 1
performance_criteria: 0.75
use_aggressive_leveling: true

# Paddle settings
paddle_size: 0.8
paddle_lag: 360
step_size: 5 #0.5 for 'press' mode

# Ball settings
ball_radius: 0.04
send_speed: 0.02
receive_speed: 0.0025

# Timing parameters
reset_timer: 0
reset_delay: 1.0
time_limit: 120.0 #2 min
pre_delay: 6
block_pre_delay: 30

# Opponent settings
opponent_handicap: 0
agent_miss_prob: 0.95
agent_miss_mode: random # random = independent per agent attempt; adaptive = tracks target rate across attempts
agent_miss_offset: 0.15
agent_tracking_noise: 0.0
